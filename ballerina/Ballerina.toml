[package]
authors = ["Ballerina"]
distribution = "2201.12.0"
keywords = ["Agent", "Model", "Provider", "Vendor/OpenAI", "Area/AI & Machine Learning", "Type/Embedding Provider", "Type/Model Provider", "Type/Connector", "Name/OpenAI Model/Embedding Provider"]
license = ["Apache-2.0"]
icon="icon.png"
name = "ai.openai"
org = "ballerinax"
repository = "https://github.com/ballerina-platform/module-ballerinax-ai.openai"
version = "1.4.0"

# TODO: Remove this block before merging.
# The streaming API (`ai:ChatCompletionChunk`, `ModelProvider.chatStream`) is not in any
# published `ballerina/ai` release yet; it exists only in the local build of the
# `feat/add-chat-stream-support` branch of module-ballerina-ai. Once that lands and is
# released (at a version above the published 1.14.0), drop `repository = "local"` and let
# this resolve from central.
[[dependency]]
org = "ballerina"
name = "ai"
version = "1.13.0"
repository = "local"

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerina.lib"
artifactId = "ai.openai-native"
version = "1.4.0"
path = "../native/build/libs/ai.openai-native-1.4.0-SNAPSHOT.jar"
